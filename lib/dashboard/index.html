<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chartroom</title>
<link rel="icon" href="data:,">
<style>
  /* Chartroom: a chart table on the bridge. Paper chart by day, night watch by dark.
     Work under way moves (a heartbeat and a wake), waiting rides at anchor, what needs
     you glows like a beacon. Every loop animates transform/opacity only, and
     prefers-reduced-motion turns all of it off. */
  :root {
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --body: "Avenir Next", Avenir, "Segoe UI Variable Text", "Segoe UI", "Gill Sans", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --bg: #efe7d6; --bg2: #e4d9c1; --panel: #fbf7ee; --panel2: #f4ecdc; --ink: #14243a; --muted: #5d6976;
    --faint: #8c9196; --line: rgba(20,36,58,.15); --line2: rgba(20,36,58,.07); --chip: rgba(20,36,58,.06);
    --link: #0d5a8a;
    --needs: #c2412b; --prog: #0f7490; --wait: #9c6c0c; --hold: #7a6a55; --ready: #2e7d4c; --recent: #7b848c;
    --sweep: rgba(15,116,144,.18); --contour: .5; --grid: rgba(20,36,58,.045);
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 1px 2px rgba(20,36,58,.08), 0 10px 24px -18px rgba(20,36,58,.45);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: #061420; --bg2: #0a1d2d; --panel: #0d2133; --panel2: #0a1b2a; --ink: #e2ebf1; --muted: #8fa4b5;
      --faint: #5f7586; --line: rgba(150,200,230,.15); --line2: rgba(150,200,230,.07); --chip: rgba(150,200,230,.08);
      --link: #7cc7ec;
      --needs: #ff7b5c; --prog: #41c9e2; --wait: #e9b956; --hold: #ab9c88; --ready: #5ed592; --recent: #71879a;
      --sweep: rgba(65,201,226,.13); --contour: .28; --grid: rgba(150,200,230,.035);
      --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 30px -18px rgba(0,0,0,.9);
      color-scheme: dark;
    }
  }
  :root[data-theme=dark] {
    --bg: #061420; --bg2: #0a1d2d; --panel: #0d2133; --panel2: #0a1b2a; --ink: #e2ebf1; --muted: #8fa4b5;
    --faint: #5f7586; --line: rgba(150,200,230,.15); --line2: rgba(150,200,230,.07); --chip: rgba(150,200,230,.08);
    --link: #7cc7ec;
    --needs: #ff7b5c; --prog: #41c9e2; --wait: #e9b956; --hold: #ab9c88; --ready: #5ed592; --recent: #71879a;
    --sweep: rgba(65,201,226,.13); --contour: .28; --grid: rgba(150,200,230,.035);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 30px -18px rgba(0,0,0,.9);
    color-scheme: dark;
  }
  [data-lane=needs_you] { --accent: var(--needs); }
  [data-lane=in_progress] { --accent: var(--prog); }
  [data-lane=on_hold] { --accent: var(--hold); }
  [data-lane=ready] { --accent: var(--ready); }
  [data-lane=recent] { --accent: var(--recent); }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--ink); background:
           radial-gradient(1200px 700px at 85% -10%, var(--bg2), transparent 70%),
           linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 64px,
           linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 64px 100%,
           var(--bg);
         font: 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--prog); outline-offset: 2px; border-radius: 4px; }

  /* ambient sea: drifting depth contours and a slow sonar sweep, both fixed, transform-only */
  .sea { position: fixed; inset: -25%; z-index: -1; pointer-events: none; opacity: var(--contour);

  .sweep { position: fixed; z-index: -1; pointer-events: none; width: 1100px; height: 1100px; right: -520px; top: -520px;
           border-radius: 50%; will-change: transform;
           background: conic-gradient(from 0deg, transparent 0deg 292deg, var(--sweep) 359deg, transparent 360deg),
                       repeating-radial-gradient(circle, transparent 0 109px, var(--line2) 110px 111px);
           animation: spin 18s linear infinite; }
  @keyframes drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-6%, -4%, 0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* the bridge */
  header.bridge { position: sticky; top: 0; z-index: 3; padding: 12px 20px 10px;
                  background: color-mix(in srgb, var(--bg) 82%, transparent);
                  -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2);
                  border-bottom: 1px solid var(--line);
                  display: grid; grid-template-columns: auto 1fr auto; gap: 10px 20px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .rose { width: 42px; height: 42px; flex: none; color: var(--ink); }
  .rose .needle { transform-origin: 32px 32px; animation: swing 6s ease-in-out infinite; }
  .rose .needle .n { fill: var(--needs); }
  .rose .needle .s { fill: var(--muted); }
  body.alert .rose .needle { animation-duration: 2s; }
  @keyframes swing { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(7deg); } }
  .brand h1 { margin: 0; font: italic 600 26px/1 var(--display); letter-spacing: .01em; }
  .brand h1 small { font: 600 10px/1 var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
                    font-style: normal; margin-left: 8px; vertical-align: 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
  .instruments { grid-column: 3; display: flex; align-items: center; gap: 14px; font: 12px var(--mono); color: var(--muted); }
  .watch b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .sounding { display: flex; align-items: center; gap: 6px; position: relative; }
  .sounding svg { width: 20px; height: 20px; transform: rotate(-90deg); flex: none; }
  .sounding .track { stroke: var(--line); }
  .sounding .arc { stroke: var(--prog); stroke-dasharray: 50.27; stroke-dashoffset: 0; }
  .sounding .ping { position: absolute; left: 0; top: 50%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%;
                    border: 1.5px solid var(--prog); pointer-events: none; opacity: 0; }
  .sounding span { font-variant-numeric: tabular-nums; min-width: 7ch; }
  .theme { font: inherit; color: var(--muted); background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
           padding: 3px 10px; cursor: pointer; }
  .theme:hover { color: var(--ink); }

  .counts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .gauge { position: relative; display: flex; align-items: baseline; gap: 8px; padding: 6px 10px 8px; border-radius: 8px;
           background: var(--chip); border: 1px solid var(--line2); color: var(--ink); overflow: hidden; }
  .gauge:hover { text-decoration: none; border-color: var(--line); }
  .gauge .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); flex: 1;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gauge b { font: 600 22px/1 var(--display); font-variant-numeric: tabular-nums lining-nums; display: inline-block; }
  .gauge .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent);
                transform-origin: left; transform: scaleX(0); transition: transform .9s cubic-bezier(.2,.8,.2,1); }
  .gauge .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); align-self: center; flex: none;
                 opacity: .35; }
  .gauge.hot .lamp { opacity: 1; animation: beacon 2s ease-in-out infinite; animation-delay: var(--sync, 0s); }
  .gauge.hot { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  /* ship's log: the newest signals across the fleet */
  .log { margin: 12px 20px 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: start; }
  .log h3 { margin: 2px 0 0; font: italic 600 15px/1.2 var(--display); color: var(--muted); white-space: nowrap; }
  .log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; min-width: 0; }
  .log li { display: grid; grid-template-columns: 7ch minmax(0, 14rem) minmax(0, 1fr); gap: 10px; align-items: baseline;
            font-size: 12.5px; padding: 2px 8px; border-radius: 6px; cursor: default; position: relative; }
  .log li.open { cursor: pointer; }
  .log li.open:hover { background: var(--chip); }
  .log .t { font: 11.5px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
  .log .who { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log li.fresh { animation: logIn .7s cubic-bezier(.2,.8,.2,1) both; }
  .log li.fresh::before { content: ""; position: absolute; inset: 0; border-radius: 6px; background: var(--prog);
                          opacity: 0; animation: wash 2.6s ease-out; pointer-events: none; }
  @keyframes logIn { from { opacity: 0; transform: translateY(-10px); } }
  @keyframes wash { 0% { opacity: .22; } 100% { opacity: 0; } }
  .kind { font: 600 10.5px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 2px 5px;
          border-radius: 4px; margin-right: 6px; background: var(--chip); color: var(--muted); vertical-align: 1px; }
  .kind.progress, .kind.steered { color: var(--prog); }
  .kind.decision, .kind.blocked, .kind.failed { color: var(--needs); }
  .kind.waiting { color: var(--wait); }
  .kind.done { color: var(--ready); }

  .banner { margin: 12px 20px 0; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--needs);
            color: var(--needs); background: color-mix(in srgb, var(--needs) 8%, transparent); display: none; overflow-wrap: anywhere; }

  /* lanes */
  main { display: grid; gap: 18px; padding: 16px 20px 48px; grid-template-columns: repeat(auto-fit, minmax(256px, 1fr));
         align-items: start; }
  section.lane { min-width: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .lane h2 { margin: 2px 0 10px; display: flex; align-items: center; gap: 9px; font: 600 12px/1 var(--body);
             letter-spacing: .16em; text-transform: uppercase; padding-bottom: 8px;
             border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .lane h2 .n { margin-left: auto; font: 600 18px/1 var(--display); letter-spacing: 0; color: var(--accent);
                font-variant-numeric: tabular-nums lining-nums; display: inline-block; }
  .lane h2 .sig { width: 10px; height: 10px; }
  .cards { display: grid; gap: 10px; }
  .foot:empty { display: none; }
  .foot { margin-top: 10px; }
  .empty { color: var(--faint); font: italic 13px var(--display); padding: 4px 2px 10px; }
  .more { background: none; border: 1px dashed var(--line); color: var(--muted); border-radius: 8px; width: 100%;
          padding: 7px; cursor: pointer; font: inherit; font-size: 12px; }
  .more:hover { color: var(--ink); border-color: var(--accent); }
  .approvals { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .approvals ul { margin: 4px 0 0; padding-left: 18px; }
  .approvals li { margin: 2px 0; overflow-wrap: anywhere; }

  /* cards */
  .card { position: relative; min-width: 0; padding: 10px 12px 11px 14px; border-radius: 9px;
          background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--line);
          box-shadow: var(--shadow); transition: transform .25s ease; }
  .card::before { content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px;
                  background: var(--accent); }
  .card:hover { transform: translateY(-2px); }
  .card.inbox { border-style: dashed; }
  .card .head { display: flex; gap: 9px; align-items: flex-start; }
  .card .title { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; flex: 1; min-width: 0; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--chip);
           color: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
  .badge.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .clock { margin-top: 6px; font: 11.5px/1.3 var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px;
           font-variant-numeric: tabular-nums; }
  .clock b { color: var(--ink); font-weight: 500; }
  .clock .lbl { color: var(--faint); margin-right: 4px; }
  .card .last { margin-top: 6px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; }
  .card .waiting { margin-top: 6px; font-size: 12.5px; overflow-wrap: anywhere; }
  .card .waiting .until { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .card .waiting .until.over { color: var(--needs); }
  .card .links { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; }

  /* signal glyphs, one per state */
  .sig { position: relative; flex: none; width: 12px; height: 12px; margin-top: 3px; color: var(--accent); }
  .sig.dot::before, .sig.dot::after { content: ""; position: absolute; inset: 1px; border-radius: 50%; background: var(--accent); }
  .sig.dot::after { opacity: 0; }
  .sig.ring::before { content: ""; position: absolute; inset: 1px; border-radius: 50%; border: 2px solid var(--accent); }
  .sig svg { position: absolute; inset: -2px; width: 16px; height: 16px; }

  /* under way: a heartbeat that ripples out, and a wake running along the keel */
  .m-underway .sig.dot::after { animation: ripple 2s cubic-bezier(.2,.6,.3,1) infinite; animation-delay: var(--sync, 0s); }
  .m-underway.fresh .sig.dot::after { animation-duration: 1.2s; }
  .m-underway .sig.dot::before { animation: beat 2s ease-in-out infinite; animation-delay: var(--sync, 0s); }
  .m-underway.fresh .sig.dot::before { animation-duration: 1.2s; }
  .wake { position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; overflow: hidden; border-radius: 2px; }
  .wake::before { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: .12; }
  .wake i { position: absolute; top: 0; bottom: 0; left: 0; width: 38%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: wake 2.4s cubic-bezier(.45,0,.35,1) infinite; animation-delay: var(--sync, 0s); }
  .m-draft .sig.dot::before { animation: blink 1.2s steps(2, jump-none) infinite; animation-delay: var(--sync, 0s); }
  @keyframes ripple { 0% { opacity: .65; transform: scale(1); } 100% { opacity: 0; transform: scale(2.8); } }
  @keyframes beat { 0%,100% { transform: scale(.85); } 15% { transform: scale(1.15); } 30% { transform: scale(.92); } 45% { transform: scale(1.05); } }
  @keyframes wake { from { transform: translateX(-100%); } to { transform: translateX(270%); } }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: .25; } }

  /* waiting: riding at anchor, patient and slow */
  .card.m-anchor { --accent: var(--wait); }
  .m-anchor .sig svg { animation: bob 4s ease-in-out infinite; animation-delay: var(--sync, 0s); }
  .m-anchor .wake { opacity: .6; }
  .m-anchor .wake::before { background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 12px); opacity: .35;
                            animation: none; }
  @keyframes bob { 0%,100% { transform: translateY(-1.5px) rotate(-6deg); } 50% { transform: translateY(1.5px) rotate(6deg); } }

  /* needs you: a beacon, a soft glow and a slow gleam; noticed, never shouting */
  .m-attn .sig.dot::before { animation: beacon 2s ease-in-out infinite; animation-delay: var(--sync, 0s); }
  .m-attn .sig.dot::after { animation: ripple 2s ease-out infinite; animation-delay: var(--sync, 0s); }
  .m-attn .glow { position: absolute; inset: -1px; border-radius: 10px; pointer-events: none; opacity: .45;
                  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent),
                              0 0 22px -2px color-mix(in srgb, var(--accent) 55%, transparent);
                  animation: glow 4s ease-in-out infinite; animation-delay: var(--sync, 0s); }
  .gleam { position: absolute; inset: 0; border-radius: 9px; overflow: hidden; pointer-events: none; }
  .gleam::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; opacity: 0;
                  background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--accent) 16%, transparent), transparent);
                  transform: translateX(-120%); }
  .m-attn .gleam::after { animation: gleam 6s ease-in-out infinite; animation-delay: var(--sync, 0s); }
  @keyframes beacon { 0%,100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes glow { 0%,100% { opacity: .2; } 50% { opacity: .85; } }
  @keyframes gleam { 0%,55% { transform: translateX(-120%); opacity: 1; } 85%,100% { transform: translateX(260%); opacity: 1; } }

  /* on hold, ready, logged: still water */
  .m-hold { background: linear-gradient(180deg, var(--panel2), var(--panel2)); }
  .m-hold .title { color: color-mix(in srgb, var(--ink) 80%, var(--muted)); }
  .m-logged { opacity: .78; box-shadow: none; background: transparent; border-style: solid; border-color: var(--line2); }
  .m-logged:hover { opacity: 1; }
  .m-logged .title { font-weight: 500; }

  /* a new signal on a card: a gleam across it and the line washed in */
  .card.flash .gleam::after { animation: gleam-once 1.4s ease-out 1; }
  .card.flash .last, .card.flash .waiting { animation: ink 2.6s ease-out 1; }
  @keyframes gleam-once { from { transform: translateX(-120%); opacity: 1; } to { transform: translateX(260%); opacity: 1; } }
  @keyframes ink { 0% { background: color-mix(in srgb, var(--accent) 22%, transparent); } 100% { background: transparent; } }

  .ghost { position: fixed; z-index: 2; pointer-events: none; margin: 0; }

  dialog { width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line);
           border-radius: 12px; background: var(--panel); color: var(--ink); box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
  dialog[open] { animation: unfurl .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes unfurl { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  dialog::backdrop { background: rgba(4,12,20,.5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  dialog .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line);
                position: sticky; top: 0; background: var(--panel); }
  dialog .bar b { flex: 1; overflow-wrap: anywhere; font: italic 600 15px var(--display); }
  dialog button { font: inherit; font-size: 12px; background: var(--chip); color: var(--ink); border: 1px solid var(--line);
                  border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  dialog pre { margin: 0; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
               font: 12.5px/1.55 var(--mono); }

  @media (max-width: 760px) {
    header.bridge { position: static; grid-template-columns: 1fr; padding: 10px 16px; }
    .instruments { grid-column: 1; flex-wrap: wrap; }
    .counts { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .log { margin: 10px 16px 0; grid-template-columns: 1fr; }
    .log li { grid-template-columns: 6ch minmax(0, 1fr); }
    .log .who { display: none; }
    .banner { margin: 10px 16px 0; }
    main { padding: 14px 16px 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .sea, .sweep { display: none; }
  }
</style>
</head>
<body>
<div class="sea" aria-hidden="true"></div>
<div class="sweep" aria-hidden="true"></div>
<header class="bridge">
  <div class="brand">
    <svg class="rose" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-opacity=".35"/>
      <circle cx="32" cy="32" r="23" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="1 3.2"/>
      <path d="M32 5 35 29 59 32 35 35 32 59 29 35 5 32 29 29Z" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-opacity=".4" stroke-width=".8"/>
      <g class="needle"><path class="n" d="M32 11 35.2 32H28.8Z"/><path class="s" d="M32 53 35.2 32H28.8Z"/><circle cx="32" cy="32" r="2.4" fill="currentColor"/></g>
    </svg>
    <div>
      <h1>Chartroom<small>fleet</small></h1>
      <div class="meta" id="meta">loading…</div>
    </div>
  </div>
  <div class="instruments">
    <span class="watch" title="local time">watch <b id="clock">--:--:--</b></span>
    <span class="sounding" id="sounding" title="the board refreshes every few seconds">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle class="track" cx="10" cy="10" r="8" fill="none" stroke-width="2"/><circle class="arc" id="arc" cx="10" cy="10" r="8" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="sounded">sounding…</span>
    </span>
    <button class="theme" id="theme" type="button">auto</button>
  </div>
  <nav class="counts" id="counts" aria-label="lane counts"></nav>
</header>
<section class="log" id="log" hidden><h3>Ship’s log</h3><ol id="log-list"></ol></section>
<div class="banner" id="banner"></div>
<main id="lanes"></main>
<div id="ghosts"></div>
<dialog id="viewer">
  <div class="bar"><b id="viewer-title"></b><a id="viewer-raw" target="_blank" rel="noopener">raw</a><button id="viewer-close" type="button">close</button></div>
  <pre id="viewer-body"></pre>
</dialog>
<script>
"use strict";
const LANES = [
  ["needs_you", "Needs you"],
  ["in_progress", "In progress"],
  ["on_hold", "On hold"],
  ["ready", "Ready for you"],
  ["recent", "Recently finished"],
];
const SHOW = { recent: 8 };
const expanded = {};
const POLL_MS = 5000;
const LOG_ROWS = 5;
const SYNC_MS = 12000; // every looping animation's period divides this, so rebuilt cards stay in step
const reduced = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

const ICONS = {
  anchor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="2.3"/><path d="M12 7.3V21M7.5 11h9M4.5 14.5c.8 3.6 3.8 6.5 7.5 6.5s6.7-2.9 7.5-6.5"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V3M5 4h12l-3 4.5 3 4.5H5"/></svg>',
  logged: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
};
function icon(name) { const t = document.createElement("template"); t.innerHTML = ICONS[name]; return t.content.firstChild; }

function ms(iso) { if (!iso) return NaN; return Date.parse(iso); }

// Durations that tick: "42s", "12m 04s", "5h 12m", "3d 4h".
function dur(msec) {
  let s = Math.max(0, Math.floor(msec / 1000));
  if (s < 60) return s + "s";
  let m = Math.floor(s / 60); s %= 60;
  if (m < 60) return m + "m " + String(s).padStart(2, "0") + "s";
  let h = Math.floor(m / 60); m %= 60;
  if (h < 48) return h + "h " + String(m).padStart(2, "0") + "m";
  return Math.floor(h / 24) + "d " + (h % 24) + "h";
}
// The coarse form for things that do not need to tick: "42s", "12m", "5h", "3d".
function ago(iso) {
  const t = ms(iso);
  if (isNaN(t)) return "";
  let s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return Math.floor(s) + "s";
  if ((s /= 60) < 60) return Math.floor(s) + "m";
  if ((s /= 60) < 48) return Math.floor(s) + "h";
  return Math.floor(s / 24) + "d";
}
function sinceText(t) { return dur(Date.now() - t); }
function untilText(t) { const now = Date.now(); return t >= now ? "in " + dur(t - now) : dur(now - t) + " overdue"; }

// A span whose text the 1s tick keeps current. kind: "since" (elapsed) or "until" (countdown).
function ticker(kind, iso, suffix) {
  const t = ms(iso);
  if (isNaN(t)) return null;
  const n = el("b", { title: iso, "data-suffix": suffix || null });
  n.dataset[kind] = String(t);
  paint(n, Date.now());
  return n;
}
function paint(n, now) {
  let txt;
  if (n.dataset.since) txt = dur(now - +n.dataset.since) + (n.dataset.suffix || "");
  else { const t = +n.dataset.until; txt = t >= now ? "in " + dur(t - now) : dur(now - t) + " overdue"; n.classList.toggle("over", t < now); }
  if (n.textContent !== txt) n.textContent = txt;
}

function prLabel(url) {
  const m = url.match(/^https?:\/\/[^/]+\/(.+?)\/(?:-\/)?(?:pull|pulls|merge_requests|pullrequest)\/(\d+)$/);
  return m ? m[1].split("/").slice(-1)[0] + "#" + m[2] : url;
}

function safeHref(url) { return /^https?:\/\//.test(url) ? url : null; }

// "progress: text" -> [kind tag, text]
function eventLine(ev) {
  const m = /^([a-z][a-z-]{1,15}): ([\s\S]*)$/.exec(ev || "");
  if (!m) return [null, ev || ""];
  return [el("span", { class: "kind " + m[1], text: m[1] }), m[2]];
}

function motionOf(c, lane) {
  if (lane === "needs_you") return "attn";
  if (lane === "in_progress") return c.state === "waiting" ? "anchor" : c.state === "drafting" ? "draft" : "underway";
  return { on_hold: "hold", ready: "ready", recent: "logged" }[lane];
}

function signal(motion) {
  if (motion === "anchor") return el("span", { class: "sig", "aria-hidden": "true" }, icon("anchor"));
  if (motion === "ready") return el("span", { class: "sig", "aria-hidden": "true" }, icon("flag"));
  if (motion === "logged") return el("span", { class: "sig", "aria-hidden": "true" }, icon("logged"));
  if (motion === "hold") return el("span", { class: "sig ring", "aria-hidden": "true" });
  return el("span", { class: "sig dot", "aria-hidden": "true" });
}

function clockRow(c, motion) {
  const row = el("div", { class: "clock" });
  const add = (label, node) => { if (node) row.append(el("span", {}, el("span", { class: "lbl", text: label }), node)); };
  if (c.type !== "task") {
    if (c.date) add("since", el("b", { text: c.date }));
    return row.childNodes.length ? row : null;
  }
  if (motion === "underway" || motion === "draft") {
    add(motion === "draft" ? "drafting" : "under way", ticker("since", c.created));
    add("last signal", ticker("since", c.last_at, " ago"));
  } else if (motion === "anchor") {
    add("at anchor", ticker("since", c.last_at));
    add("age", el("b", { text: ago(c.created), title: c.created }));
  } else if (motion === "attn") {
    add("waiting on you", ticker("since", c.last_at));
    add("age", el("b", { text: ago(c.created), title: c.created }));
  } else if (motion === "hold") {
    add("quiet for", ticker("since", c.last_at));
    add("age", el("b", { text: ago(c.created), title: c.created }));
  } else if (motion === "ready") {
    add("ready", ticker("since", c.last_at, " ago"));
    add("age", el("b", { text: ago(c.created), title: c.created }));
  } else {
    add("finished", ticker("since", c.finished_at || c.closed || c.last_at, " ago"));
  }
  return row.childNodes.length ? row : null;
}

function card(c, lane) {
  const motion = motionOf(c, lane);
  const fresh = c.type === "task" && Date.now() - ms(c.last_at) < 120000;
  const sub = el("div", { class: "sub" });
  if (c.type === "task") {
    if (c.project) sub.append(el("span", { text: c.project }));
    sub.append(el("span", { class: "badge accent", text: c.reason || c.state }));
  } else {
    sub.append(el("span", { class: "badge accent", text: "inbox" }));
  }
  const node = el("article", { class: "card m-" + motion + (c.type === "inbox" ? " inbox" : "") + (fresh ? " fresh" : "") },
    el("div", { class: "gleam", "aria-hidden": "true" }),
    motion === "attn" ? el("div", { class: "glow", "aria-hidden": "true" }) : null,
    el("div", { class: "head" }, signal(motion), el("div", { class: "title", text: c.title || c.id, title: c.id })),
    sub, clockRow(c, motion));
  if (c.type === "task" && c.waiting_on) {
    const w = el("div", { class: "waiting", text: "waiting on: " + c.waiting_on });
    if (c.waiting_until) {
      const u = ticker("until", c.waiting_until);
      if (u) { u.classList.add("until"); w.append(el("span", { class: "until", text: " · until " }), u); }
    }
    node.append(w);
  } else if (c.type === "task" && c.last_event) {
    const [tag, text] = eventLine(c.last_event);
    node.append(el("div", { class: "last", title: c.last_event }, tag, text));
  }
  const links = el("div", { class: "links" });
  for (const p of c.prs || []) {
    const href = safeHref(p.url);
    if (!href) continue;
    const a = el("a", { href, target: "_blank", rel: "noopener noreferrer", text: prLabel(p.url) });
    links.append(a);
    if (p.state && p.state !== "UNKNOWN") {
      const st = p.isDraft ? "draft" : p.state.toLowerCase() + (p.reviewDecision && p.state === "OPEN" ? " · " + p.reviewDecision.toLowerCase().replace(/_/g, " ") : "");
      links.append(el("span", { class: "badge", text: st }));
    }
  }
  for (const f of c.files || []) {
    const href = "/task/" + encodeURIComponent(c.id) + "/" + encodeURIComponent(f);
    const a = el("a", { href, text: f.replace(/\.(md|log)$/, "") });
    a.addEventListener("click", (e) => { if (e.metaKey || e.ctrlKey) return; e.preventDefault(); view(c, f, href); });
    links.append(a);
  }
  if (links.childNodes.length) node.append(links);
  if (motion === "underway" || motion === "draft" || motion === "anchor") node.append(el("div", { class: "wake", "aria-hidden": "true" }, el("i")));
  return node;
}

function sync(n) { n.style.setProperty("--sync", -(performance.now() % SYNC_MS) + "ms"); }

// Count tick: ease from the old number to the new one, with a small bump.
function tween(node, to) {
  const from = node.dataset.v == null ? 0 : +node.dataset.v;
  node.dataset.v = String(to);
  if (from === to) { node.textContent = String(to); return; }
  if (reduced.matches || document.hidden) { node.textContent = String(to); return; }
  const t0 = performance.now(), D = 800;
  const step = (t) => {
    const p = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - p, 3);
    node.textContent = String(Math.round(from + (to - from) * e));
    if (p < 1 && node.dataset.v === String(to)) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  node.animate([{ transform: "translateY(-4px) scale(1.18)" }, { transform: "none" }], { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)" });
}

// ---------------------------------------------------------------- board

const lanesEl = document.getElementById("lanes");
const sections = {};   // lane -> {sec, n, cards, foot}
const gauges = {};     // lane -> {a, b, bar}
let nodes = new Map(); // card key -> node (node._sig, node._lane, node._last)
let firstRender = true;
let seenLog = null;

function buildFrame() {
  const counts = document.getElementById("counts");
  LANES.forEach(([k, label], i) => {
    const n = el("span", { class: "n", text: "0" });
    const cards = el("div", { class: "cards" });
    const foot = el("div", { class: "foot" });
    const sec = el("section", { class: "lane", "data-lane": k, id: "lane-" + k, style: "--i:" + i },
      el("h2", {}, el("span", { class: "sig dot", "aria-hidden": "true" }), label, n), cards, foot);
    if (k === "in_progress") sec.querySelector("h2").classList.add("m-underway");
    if (k === "needs_you") sec.querySelector("h2").classList.add("m-attn");
    sections[k] = { sec, n, cards, foot };
    lanesEl.append(sec);
    const b = el("b", { text: "0" });
    const bar = el("i", { class: "bar" });
    const a = el("a", { class: "gauge", href: "#lane-" + k, "data-lane": k },
      el("span", { class: "lamp", "aria-hidden": "true" }), el("span", { class: "lbl", text: label }), b, bar);
    sync(a);
    gauges[k] = { a, b, bar };
    counts.append(a);
  });
}

function render(d) {
  document.getElementById("meta").textContent =
    d.home + " · updated " + new Date(d.generated_at).toLocaleTimeString() +
    (d.pr_enrichment && d.pr_enrichment.enabled ? " · PR states via gh" : "");
  const max = Math.max(1, ...LANES.map(([k]) => d.counts[k] || 0));
  for (const [k] of LANES) {
    const v = d.counts[k] || 0, g = gauges[k];
    tween(g.b, v);
    g.bar.style.transform = "scaleX(" + (v / max).toFixed(3) + ")";
    if (k === "needs_you") g.a.classList.toggle("hot", v > 0);
  }
  document.body.classList.toggle("alert", (d.counts.needs_you || 0) > 0);

  // First: where every card is now.
  const animate = !firstRender && !reduced.matches && !document.hidden;
  const before = new Map();
  if (animate) for (const [key, n] of nodes) if (n.isConnected) before.set(key, n.getBoundingClientRect());

  const next = new Map(), entering = [], flashing = [];
  for (const [k] of LANES) {
    const items = d.lanes[k] || [];
    const { n, cards, foot } = sections[k];
    tween(n, items.length);
    const limit = SHOW[k] && !expanded[k] ? SHOW[k] : Infinity;
    const want = items.slice(0, limit).map((c) => {
      const key = c.id, sig = k + "\n" + JSON.stringify(c), old = nodes.get(key);
      if (old && old._sig === sig) { next.set(key, old); return old; }
      const m = card(c, k);
      m._sig = sig; m._lane = k; m._last = c.last_event || c.waiting_on || ""; m._at = ms(c.last_at);
      if (!old) entering.push(m);
      else if (old._last !== m._last) flashing.push(m);
      next.set(key, m);
      return m;
    });
    // Place the wanted nodes in order, moving only what is out of place.
    let ref = cards.firstChild;
    for (const m of want) {
      if (m === ref) { ref = ref.nextSibling; continue; }
      sync(m);
      cards.insertBefore(m, ref);
    }
    while (ref) { const nx = ref.nextSibling; ref.remove(); ref = nx; }

    foot.replaceChildren();
    if (!items.length) foot.append(el("div", { class: "empty", text: k === "needs_you" ? "Nothing needs you. Fair winds." : "None." }));
    if (items.length > limit) {
      const b = el("button", { class: "more", type: "button", text: "show all " + items.length });
      b.addEventListener("click", () => { expanded[k] = true; render(d); });
      foot.append(b);
    }
    if (k === "needs_you" && d.inbox && d.inbox.approvals && d.inbox.approvals.length) {
      foot.append(el("div", { class: "approvals", text: "Approvals given in chat, not yet in a brief:" },
        el("ul", {}, ...d.inbox.approvals.map((a) => el("li", { text: (a.date ? a.date + " — " : "") + a.text })))));
    }
  }

  // Cards that left the board fade out where they were.
  const ghosts = document.getElementById("ghosts");
  for (const [key, old] of nodes) {
    if (next.has(key)) { if (next.get(key) !== old) old.remove(); continue; }
    old.remove();
    const r = before.get(key);
    if (!animate || !r) continue;
    const g = el("div", { class: "ghost", "data-lane": old._lane,
      style: "left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px" }, old);
    ghosts.append(g);
    g.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(18px) scale(.96)" }],
      { duration: 520, easing: "cubic-bezier(.4,0,.6,1)" }).onfinish = () => g.remove();
  }
  nodes = next;

  if (animate) {
    // Last, invert, play: cards that moved glide from where they were.
    for (const [key, n] of nodes) {
      const a = before.get(key);
      if (!a) continue;
      const b = n.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) + Math.abs(dy) < 1) continue;
      n.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
        { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)" });
    }
    for (const m of entering) {
      m.animate([{ opacity: 0, transform: "translateY(-10px) scale(.97)" }, { opacity: 1, transform: "none" }],
        { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
    }
    for (const m of flashing) { m.classList.add("flash"); setTimeout(() => m.classList.remove("flash"), 2700); }
  } else if (firstRender && !reduced.matches) {
    let i = 0;
    for (const [k] of LANES) for (const m of sections[k].cards.children) {
      m.animate([{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "none" }],
        { duration: 600, delay: 120 + Math.min(i++, 24) * 35, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
    }
  }
  renderLog(d);
  firstRender = false;
  document.title = (d.counts.needs_you ? "(" + d.counts.needs_you + ") " : "") + "chartroom";
}

// Ship's log: the newest events across every task, new ones washing in.
function renderLog(d) {
  const all = [];
  for (const [k] of LANES) for (const c of d.lanes[k] || []) if (c.type === "task" && c.last_event && c.last_at) all.push(c);
  all.sort((a, b) => ms(b.last_at) - ms(a.last_at));
  const rows = all.slice(0, LOG_ROWS);
  const box = document.getElementById("log");
  box.hidden = !rows.length;
  const keys = new Set();
  const list = rows.map((c) => {
    const key = c.id + "\n" + c.last_at + "\n" + c.last_event;
    keys.add(key);
    const [tag, text] = eventLine(c.last_event);
    const t = ticker("since", c.last_at);
    const li = el("li", { title: c.last_event }, el("span", { class: "t" }, t), el("span", { class: "who", text: c.title || c.id, title: c.id }),
      el("span", { class: "what" }, tag, text));
    if (seenLog && !seenLog.has(key) && !reduced.matches) li.classList.add("fresh");
    if ((c.files || []).includes("events.log")) {
      const href = "/task/" + encodeURIComponent(c.id) + "/events.log";
      li.classList.add("open");
      li.addEventListener("click", () => view(c, "events.log", href));
    }
    return li;
  });
  document.getElementById("log-list").replaceChildren(...list);
  seenLog = keys;
}

function banner(msg) {
  const b = document.getElementById("banner");
  b.textContent = msg || "";
  b.style.display = msg ? "block" : "none";
}

// ---------------------------------------------------------------- refresh and the ticking clock

let last = null, lastOk = 0, arcAnim = null;
function sounding() {
  const arc = document.getElementById("arc");
  if (arcAnim) arcAnim.cancel();
  if (reduced.matches || !arc.animate) return;
  arcAnim = arc.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: 50.27 }], { duration: POLL_MS, easing: "linear", fill: "forwards" });
}
function ping() {
  if (reduced.matches) return;
  const p = el("span", { class: "ping", "aria-hidden": "true" });
  document.getElementById("sounding").append(p);
  p.animate([{ opacity: .8, transform: "scale(.5)" }, { opacity: 0, transform: "scale(2.4)" }],
    { duration: 1100, easing: "cubic-bezier(.2,.6,.3,1)" }).onfinish = () => p.remove();
}

async function refresh() {
  sounding();
  try {
    const r = await fetch("/api/dashboard", { cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    last = d; lastOk = Date.now();
    banner("");
    render(d);
    ping();
  } catch (e) {
    banner("Could not refresh: " + e.message + (last ? " (showing the last good view)" : ""));
  }
  tick();
}

function tick() {
  const now = Date.now();
  for (const n of document.querySelectorAll("[data-since],[data-until]")) paint(n, now);
  // a heartbeat quickens while a worker's last signal is under two minutes old
  for (const n of nodes.values()) if (n._lane === "in_progress") n.classList.toggle("fresh", now - n._at < 120000);
  const c = document.getElementById("clock"), t = new Date(now).toLocaleTimeString([], { hour12: false });
  if (c.textContent !== t) c.textContent = t;
  document.getElementById("sounded").textContent = lastOk ? "sounded " + ago(new Date(lastOk).toISOString()) + " ago" : "sounding…";
}

async function view(c, f, href) {
  const dlg = document.getElementById("viewer");
  document.getElementById("viewer-title").textContent = (c.title || c.id) + " — " + f;
  document.getElementById("viewer-raw").href = href;
  const body = document.getElementById("viewer-body");
  body.textContent = "loading…";
  if (!dlg.open) dlg.showModal();
  try {
    const r = await fetch(href, { cache: "no-store" });
    body.textContent = r.ok ? await r.text() : "could not load " + f + " (" + r.status + ")";
  } catch (e) { body.textContent = "could not load " + f + ": " + e.message; }
}
document.getElementById("viewer-close").addEventListener("click", () => document.getElementById("viewer").close());

// Theme: auto (the system's), light, or dark; remembered in this browser only.
const THEMES = ["auto", "light", "dark"];
let theme = "auto";
try { theme = THEMES.includes(localStorage.getItem("chartroom-theme")) ? localStorage.getItem("chartroom-theme") : "auto"; } catch (e) { /* storage blocked: stay on auto */ }
function applyTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  const btn = document.getElementById("theme");
  btn.textContent = theme === "auto" ? "◐ auto" : theme === "light" ? "☼ day" : "☾ night";
  btn.title = "theme: " + theme + " (click to change)";
}
document.getElementById("theme").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("chartroom-theme", theme); } catch (e) { /* not remembered, still applied */ }
  applyTheme();
});
applyTheme();

buildFrame();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
setInterval(() => { if (!document.hidden) tick(); }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
