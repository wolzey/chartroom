name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the privacy gate scans every commit's metadata
          # On PRs, test the PR head itself: GitHub's synthetic merge commit carries the
          # merging account's identity, which the privacy gate would (rightly) flag.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck bats
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bash jq shellcheck bats-core
      - name: shellcheck
        run: shellcheck -x -S warning bin/chartroom lib/*.sh lib/backends/*.sh install.sh scripts/*.sh test/stub-agent test/windows-smoke.sh test/fakes/*
      - name: no personal data
        run: scripts/privacy-gate.sh
      - name: bats
        run: bats test/
      - name: doctor with only bash, jq and git
        run: |
          export CHARTROOM_HOME="$RUNNER_TEMP/home"
          bin/chartroom doctor
      - name: install.sh smoke test into a temp HOME
        run: |
          export HOME="$RUNNER_TEMP/h" CHARTROOM_REPO="$GITHUB_WORKSPACE"
          mkdir -p "$HOME"
          git -C "$GITHUB_WORKSPACE" branch -f ci-install HEAD
          CHARTROOM_REF=ci-install bash install.sh
          "$HOME/.local/bin/chartroom" version

  # Git Bash on Windows. Non-blocking until its first green run; then drop continue-on-error.
  # (WSL2 is Linux, which the ubuntu job covers; hosted runners cannot run WSL2 reliably.)
  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Tools (Git Bash, the image's native jq.exe and python, bats from source)
        run: |
          bash --version | head -1; jq --version; git --version; python --version
          git clone -q --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git "$(cygpath -u "$RUNNER_TEMP")/bats"
      - name: the checkout is LF despite core.autocrlf (.gitattributes)
        run: |
          bad="$(git ls-files --eol | awk '$1 != "i/-text" && $2 != "w/lf"')"
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
      - name: no personal data
        run: scripts/privacy-gate.sh
      - name: bats
        run: '"$(cygpath -u "$RUNNER_TEMP")/bats/bin/bats" test/'
      - name: doctor with only bash, jq and git
        run: |
          export CHARTROOM_HOME="$(cygpath -u "$RUNNER_TEMP")/home"
          bin/chartroom doctor
      - name: install.sh and install-skills smoke test into a temp HOME
        run: |
          export HOME="$(cygpath -u "$RUNNER_TEMP")/h" CHARTROOM_REPO="$(cygpath -u "$GITHUB_WORKSPACE")"
          mkdir -p "$HOME"
          git -C "$CHARTROOM_REPO" branch -f ci-install HEAD
          CHARTROOM_REF=ci-install bash install.sh
          "$HOME/.local/bin/chartroom" version
          "$HOME/.local/bin/chartroom" install-skills --dir "$HOME/skills"
          "$HOME/.local/bin/chartroom" install-skills --dir "$HOME/skills" | grep -q '^ok   '
          test -f "$HOME/skills/chartroom/SKILL.md"
          "$HOME/.local/bin/chartroom" install-skills --dir "$HOME/skills" --uninstall
          test ! -e "$HOME/skills/chartroom"
      - name: native interop (a native agent process, the dashboard under native python)
        run: test/windows-smoke.sh
